name: Build APK

# 本地 flutter build apk 卡在下 Gradle/Maven 依赖上转半天圈，本质是国内到
# Google/Maven 仓库的网络太慢。GitHub Actions 的 runner 在海外，访问这些源
# 飞快，所以把打包这一步挪到 CI 上做，本地就不用再等了。
#
# 内嵌后端(server/ 目录)也是在这里现编的，不是拿仓库里预编译好提交的那份
# libgma.so——那份只是给本地跑 scripts/build_backend.sh 用的兜底缓存，
# 容易忘记同步导致 server/ 代码改了但 apk 里跑的还是旧二进制。CI 里用
# 官方 Go 工具链 + 正常网络重新编译，才是每次实际打进 apk 里的那份。
#
# 用法：
#   - push 到 main 分支会自动触发一次构建
#   - 也可以在 GitHub 网页的 Actions 页签手动点 "Run workflow" 触发
#   - 跑完之后在这次 workflow run 页面底部的 Artifacts 里下载 apk

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 Go (版本跟 server/go.mod 声明的一致)
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 交叉编译内嵌后端 (android/arm64)
        working-directory: server
        env:
          CGO_ENABLED: 0
          GOOS: android
          GOARCH: arm64
        run: |
          mkdir -p ../android/app/src/main/jniLibs/arm64-v8a
          go build -trimpath -ldflags="-s -w" \
            -o ../android/app/src/main/jniLibs/arm64-v8a/libgma.so .
          ls -la ../android/app/src/main/jniLibs/arm64-v8a/libgma.so

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze
        continue-on-error: true # 先不因为 lint 提示挡住打包，出问题自己去 workflow 日志里看

      - name: 打 release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: 验证 libgma.so 真的被打进了 APK
        run: |
          apk="build/app/outputs/flutter-apk/app-release.apk"
          ls -la "$apk"
          echo "--- APK 里的 lib/ 目录 ---"
          unzip -l "$apk" | grep -i "lib/" || true
          if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/libgma.so"; then
            echo "::error::libgma.so 没有被打进最终的 APK，内嵌后端启动时会找不到这个文件"
            exit 1
          fi
          echo "确认 libgma.so 已经在 APK 里"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yunting-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

