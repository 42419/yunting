name: Build APK

# 本地 flutter build apk 卡在下 Gradle/Maven 依赖上转半天圈，本质是国内到
# Google/Maven 仓库的网络太慢。GitHub Actions 的 runner 在海外，访问这些源
# 飞快，所以把打包这一步挪到 CI 上做，本地就不用再等了。
#
# 用法：
#   - push 到 main 分支会自动触发一次构建
#   - 也可以在 GitHub 网页的 Actions 页签手动点 "Run workflow" 触发
#   - 跑完之后在这次 workflow run 页面底部的 Artifacts 里下载 apk

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 确认内嵌后端二进制在仓库里
        run: |
          f="android/app/src/main/jniLibs/arm64-v8a/libgma.so"
          if [ ! -s "$f" ]; then
            echo "::error::找不到 $f，内嵌后端二进制没提交或者路径不对，打出来的 APK 会启动不了后端"
            exit 1
          fi
          ls -la "$f"

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze
        continue-on-error: true # 先不因为 lint 提示挡住打包，出问题自己去 workflow 日志里看

      - name: 打 release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yunting-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
